[package]
name = "draftpane"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Secure terminal Markdown editor with a live side-by-side preview"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qike-ms/draftpane"
readme = "README.md"
keywords = ["markdown", "terminal", "editor", "tui"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
unicode-width = "0.2"
tempfile = { version = "3.23", default-features = false, features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs"] }
