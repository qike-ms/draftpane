name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: Linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: Linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: Darwin-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: Darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Format
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo fmt --check
      - name: Lint
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build locked release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/draftpane" package/draftpane
          tar -C package -czf "draftpane-${{ matrix.asset }}.tar.gz" draftpane
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draftpane-${{ matrix.asset }}
          path: draftpane-${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum draftpane-*.tar.gz > SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Error: release ${GITHUB_REF_NAME} already exists; release assets are immutable" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --generate-notes --title "DraftPane ${GITHUB_REF_NAME}"
